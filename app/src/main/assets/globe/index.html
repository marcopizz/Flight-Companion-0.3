<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #02060d; overflow: hidden; }
  #g { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  #err { position: absolute; left: 16px; right: 16px; top: 40%; color: #ede7d9; font: 16px sans-serif; text-align: center; display: none; }
</style>
</head>
<body>
<div id="g"></div>
<div id="err">Il globo 3D richiede WebGL, che non è disponibile su questo dispositivo.</div>
<script src="globe.gl.min.js"></script>
<script>
(function () {
  var globe = null, flights = [], style = null, countries = [], lastLabelKey = null, lastFitKey = null;
  var ORANGE = '#ff7a3d', AMBER = '#ffc400', PAPER = '#f3eee3';
  var ROUTE_BLUE = '#1a73ff', ROUTE_EDGE = '#ffffff';

  function showError() { document.getElementById('err').style.display = 'block'; }

  function arcsOf() { return flights.filter(function (f) { return !(f.track && f.track.length > 2); }); }

  // Tratto reale: bordo bianco + anima blu (stile navigatore)
  function pathsOf() {
    var out = [];
    flights.filter(function (f) { return f.track && f.track.length > 2; }).forEach(function (f) {
      var n = f.track.length;
      var base = [[f.depLat, f.depLng, 0.004]];
      for (var i = 0; i < n; i++) {
        base.push([f.track[i][0], f.track[i][1], 0.006 + 0.03 * Math.sin(Math.PI * i / Math.max(1, n - 1))]);
      }
      base.push([f.arrLat, f.arrLng, 0.004]);
      var edge = base.map(function (p) { return [p[0], p[1], p[2]]; });
      var core = base.map(function (p) { return [p[0], p[1], p[2] + 0.0015]; });
      out.push({ id: f.id, pts: edge, color: ROUTE_EDGE, stroke: 0.75 });
      out.push({ id: f.id, pts: core, color: ROUTE_BLUE, stroke: 0.5 });
    });
    return out;
  }

  function airportsOf() {
    var m = {};
    flights.forEach(function (f) {
      m[f.dep] = { code: f.dep, lat: f.depLat, lng: f.depLng };
      m[f.arr] = { code: f.arr, lat: f.arrLat, lng: f.arrLng };
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }

  function refreshLabels(force) {
    if (!globe) return;
    var alt = globe.pointOfView().altitude;
    var showC = style === 'map' && countries.length > 0 && alt < 1.5;
    var key = (showC ? 'c' : 'a') + '|' + style;
    if (!force && key === lastLabelKey) return;
    lastLabelKey = key;
    var apColor = style === 'map' ? '#14263f' : '#ffffff';
    var arr = airportsOf().map(function (a) { return { text: a.code, lat: a.lat, lng: a.lng, size: 0.85, color: apColor }; });
    if (showC) {
      countries.forEach(function (c) {
        if (c.r <= 5) arr.push({ text: c.n, lat: c.la, lng: c.lo, size: 0.55, color: '#5a5f69' });
      });
    }
    globe.labelsData(arr);
  }

  function applyStyle(s) {
    if (!globe || s === style) return;
    style = s;
    if (s === 'map') {
      globe.globeImageUrl('map.jpg').bumpImageUrl(null).atmosphereColor('#b8d8ff');
    } else {
      globe.globeImageUrl('earth.jpg').bumpImageUrl('topology.jpg').atmosphereColor('#8ec5ff');
    }
    refreshLabels(true);
  }

  function fit(focusId) {
    var list = flights;
    if (focusId != null) {
      var one = flights.filter(function (f) { return String(f.id) === String(focusId); });
      if (one.length) list = one;
    }
    if (!list.length) { globe.pointOfView({ lat: 25, lng: 10, altitude: 2.6 }, 800); return; }
    var x = 0, y = 0, z = 0, vs = [];
    list.forEach(function (f) {
      [[f.depLat, f.depLng], [f.arrLat, f.arrLng]].forEach(function (p) {
        var la = p[0] * Math.PI / 180, lo = p[1] * Math.PI / 180;
        var v = [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)];
        vs.push(v); x += v[0]; y += v[1]; z += v[2];
      });
    });
    var len = Math.sqrt(x * x + y * y + z * z);
    if (len < 1e-6) { globe.pointOfView({ lat: 25, lng: 10, altitude: 2.6 }, 800); return; }
    x /= len; y /= len; z /= len;
    var maxAng = 0;
    vs.forEach(function (v) {
      var d = Math.max(-1, Math.min(1, v[0] * x + v[1] * y + v[2] * z));
      maxAng = Math.max(maxAng, Math.acos(d));
    });
    var lat = Math.asin(z) * 180 / Math.PI, lng = Math.atan2(y, x) * 180 / Math.PI;
    var alt = Math.max(0.55, Math.min(3.2, 0.5 + maxAng * 1.9));
    globe.pointOfView({ lat: lat, lng: lng, altitude: alt }, 1400);
  }

  function openFlight(d) {
    try { if (window.AndroidBridge && d && d.id != null) AndroidBridge.openFlight(String(d.id)); } catch (e) {}
  }

  function loadCountries() {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', 'countries.json');
      x.onload = function () {
        try { countries = JSON.parse(x.responseText); refreshLabels(true); } catch (e) {}
      };
      x.send();
    } catch (e) {}
  }

  function init() {
    try {
      var el = document.getElementById('g');
      globe = Globe()(el)
        .width(window.innerWidth).height(window.innerHeight)
        .globeImageUrl('earth.jpg')
        .bumpImageUrl('topology.jpg')
        .backgroundImageUrl('sky.jpg')
        .atmosphereColor('#8ec5ff').atmosphereAltitude(0.2)
        .arcStartLat('depLat').arcStartLng('depLng').arcEndLat('arrLat').arcEndLng('arrLng')
        .arcColor(function (d) { return d.kind === 'future' ? [AMBER, ORANGE] : [PAPER, ORANGE]; })
        .arcStroke(0.55).arcAltitudeAutoScale(0.4)
        .arcDashLength(0.5).arcDashGap(0.12).arcDashAnimateTime(5000)
        .arcLabel(function (d) { return d.dep + ' → ' + d.arr; })
        .onArcClick(openFlight)
        .pathPoints('pts').pathPointLat(function (p) { return p[0]; }).pathPointLng(function (p) { return p[1]; })
        .pathPointAlt(function (p) { return p[2]; })
        .pathColor('color').pathStroke('stroke').pathTransitionDuration(0)
        .onPathClick(openFlight)
        .pointLat('lat').pointLng('lng').pointAltitude(0.012).pointRadius(0.28).pointColor(function () { return AMBER; })
        .labelLat('lat').labelLng('lng').labelText('text').labelSize('size').labelDotRadius(0.0)
        .labelAltitude(0.02).labelColor('color').labelResolution(2);
      style = 'sat';

      var c = globe.controls();
      c.autoRotate = false;
      c.enableDamping = true; c.dampingFactor = 0.08;
      c.minDistance = 115; c.maxDistance = 620; c.zoomSpeed = 0.9; c.rotateSpeed = 0.6;
      c.addEventListener('change', function () { refreshLabels(false); });

      window.addEventListener('resize', function () {
        globe.width(window.innerWidth).height(window.innerHeight);
      });
      globe.pointOfView({ lat: 25, lng: 10, altitude: 2.6 }, 0);
      loadCountries();
    } catch (e) { showError(); }
  }

  window.setData = function (obj) {
    if (!globe) return;
    try {
      flights = (obj && obj.flights) || [];
      applyStyle((obj && obj.style) === 'map' ? 'map' : 'sat');
      globe.arcsData(arcsOf()).pathsData(pathsOf());
      var ap = airportsOf();
      globe.pointsData(ap);
      refreshLabels(true);
      var fitKey = flights.map(function (f) { return f.id; }).join(',') + '|' + (obj ? obj.focus : '');
      if (fitKey !== lastFitKey) { lastFitKey = fitKey; fit(obj ? obj.focus : null); }
    } catch (e) {}
  };

  init();
})();
</script>
</body>
</html>
